name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proyecto:
    name: Monedero (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: proyecto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: proyecto/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:prod

  docker:
    name: Imagen Docker
    needs: proyecto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t monedero ./proyecto

  sitio:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:content
      - run: npm run build
